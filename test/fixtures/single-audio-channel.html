<!doctype html>
<html lang="en">
  <head>
    <title>The Real World</title>
  </head>
  <body>
    <div id="chatchat-scroller-energy">
      <nav>
        <a>#energy-calls</a>
        <a>leaderboard</a>
        <a>Call archive</a>
        <span>ArtCraft</span>
      </nav>
      <div style="position: absolute; top: 0">
        <div class="chat-message" data-message-id="text-only" id="text-only">
          <section data-message-id-content="text-only">
            <div>
              <span data-user-id="pope"><span class="normal-case">Pope</span></span>
              <span class="ml-3 cursor-default text-3xs opacity-50">10/08/2026</span>
            </div>
            <span class="custom-break-words">
              <div class="markdown"><p>Event: Change Your Words</p></div>
            </span>
          </section>
        </div>
      </div>
      <div style="position: absolute; top: 90px">
        <div class="chat-message" data-message-id="only-audio" id="only-audio">
          <section data-message-id-content="only-audio">
            <div>
              <span data-user-id="pope"><span class="normal-case">Pope</span></span>
              <span class="ml-3 cursor-default text-3xs opacity-50">10/10/2026</span>
            </div>
            <span class="custom-break-words">
              <div class="markdown">
                <p>Event: How to Re-program Your Thoughts</p>
                <p>Date: 10th October '26</p>
              </div>
            </span>
            <div class="mt-2 flex bg-base-200">
              <svg class="cursor-pointer"></svg>
              <button type="button">1x</button>
              <div class="text-xs">04:14 / 55:30</div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
