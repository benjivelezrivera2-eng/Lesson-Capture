<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
  <body data-theme="dark">
    <header class="top">
      <div>
        <p class="eyebrow">Local archive</p>
        <h1>Lesson Capture</h1>
      </div>
      <button type="button" id="theme" class="theme-toggle" aria-label="Switch theme">Light</button>
    </header>
    <div class="mode-toggle" role="group" aria-label="Capture mode">
      <button type="button" id="mode-audio" class="mode-btn" data-mode="audio" aria-pressed="false">Audio</button>
      <button type="button" id="mode-video" class="mode-btn is-active" data-mode="video" aria-pressed="true">Video</button>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">Checking local processor…</p>
    <p id="now-playing" class="now-playing" hidden>Play a lesson to capture it</p>
    <div id="running" hidden>
      <div id="progress" class="progress-card">
        <p id="progress-title"></p>
        <div id="bar"><div id="fill"></div></div>
        <p id="progress-text"></p>
      </div>
      <div class="running-actions">
        <button type="button" id="stop">Stop this one</button>
        <button type="button" id="stop-all">Stop all</button>
        <p id="summary"></p>
      </div>
    </div>
    <button id="start">Capture this video</button>
    <section class="history">
      <div class="history-head">
        <h2 id="history-label">Video</h2>
        <span id="history-count">0 saved</span>
      </div>
      <p id="history-empty">No video captures yet.</p>
      <ul id="history" hidden></ul>
      <button type="button" id="clear-history" hidden>Clear history</button>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
